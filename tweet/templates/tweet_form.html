{% extends "layout.html" %}

{% block title %}
    Chai Center - Home
{% endblock %}

{% block content %}
    <h1 class="text-center mt-4">Welcome to Chai Center</h1>
    <h2 class="text-center">
        {% if form.instance.pk %}
        Edit Tweet
        {% else %}
        Create Tweet
        {% endif %}
        <form method="post" enctype="multipart/form-data" class='form'>
            {% csrf_token %}
            <!-- "form.as_p" is used to render paragraphs  -->
            {{ form.as_p }} 
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        <a href="{% url 'tweet_list' %}" class="btn btn-secondary mt-2">Back to Tweet List</a>
    </h2>
{% endblock %}
